<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1115">
<title>FunHouse Quiz</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --accent:#4f8cff; --text:#e8eaf0; --muted:#8a8f9e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--card); border-radius:20px; padding:32px; max-width:420px; width:90%; text-align:center; }
  h1 { margin:0 0 8px; }
  .muted { color:var(--muted); margin-bottom:24px; }
  a { display:block; padding:14px; border-radius:12px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; margin:8px 0; }
  a.secondary { background:#2a2f3a; }
</style>
</head>
<body>
  <div class="card">
    <h1>FunHouse Quiz</h1>
    <p class="muted">Викторина и таблица результатов</p>
    <a href="/play.html">Играть</a>
    <a href="/board.html" class="secondary">Табло</a>
    <a href="/admin.html" class="secondary">Админка</a>
  </div>
</body>
</html>
